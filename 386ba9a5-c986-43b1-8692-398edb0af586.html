  <script>
    'use strict';
    var SRC_URL_112 = 'https://cdn.jsdelivr.net/gh/PlanetDogeCodes/EaglerLite@main/source%20file/egc1-12.xml';
    var SRC_URL_121 = 'https://eaglerlite1-21-11.netlify.app/';

    function EaglerLiteOptimizer(CFG) {
      'use strict';
      var S = { draws: 0 };

      // Audio Thread Offloading (Safely inherits prototype and merges options)
      if (CFG.p9) {
        var origAudioCtx = window.AudioContext || window.webkitAudioContext;
        if (origAudioCtx) {
          var WrappedAudioContext = function(opts) {
            var finalOpts = Object.assign({}, opts || {}, { latencyHint: 'playback' });
            try { return new origAudioCtx(finalOpts); } catch(e) { try { return new origAudioCtx(opts); } catch(e2) { return new origAudioCtx(); } } 
          };
          WrappedAudioContext.prototype = origAudioCtx.prototype;
          window.AudioContext = WrappedAudioContext;
          if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext;
        }
      }

      // Zoom: Pure CSS Canvas Scaling
      if (CFG.zoom) {
        var gameCanvas = null;
        function applyZoom(on) {
          if (!gameCanvas || !gameCanvas.isConnected) gameCanvas = document.querySelector('canvas');
          if (gameCanvas) {
            gameCanvas.style.transform = on ? "scale(4)" : "scale(1)";
            gameCanvas.style.transformOrigin = "center center";
            gameCanvas.style.transition = "transform 0.15s ease";
          }
        }
        document.addEventListener('keydown', function(e) { if ((e.code === 'KeyC' || e.key === 'c' || e.key === 'C' || e.keyCode === 67) && document.pointerLockElement) applyZoom(true); });
        document.addEventListener('keyup', function(e) { if ((e.code === 'KeyC' || e.key === 'c' || e.key === 'C' || e.keyCode === 67) && document.pointerLockElement) applyZoom(false); });
      }

      // AutoSprint: Custom Keybind Injection dispatched to document
      if (CFG.autosprint) {
        // sprintState is mutable so auto-detect can update it at runtime.
        var sprintState = { code: CFG.sprintKey || 'ControlLeft' };

        // --- Auto-Detect Sprint Key ---
        // EaglercraftX 1.12.2 stores its options in localStorage as Java
        // Properties format. The sprint keybind is stored as:
        //   key_key.sprint:17   (17 = Left Ctrl, the vanilla default)
        // We scan all localStorage entries for this pattern, extract the
        // numeric keycode, and map it to a KeyboardEvent code string.
        function keyCodeToCode(kc) {
          if (kc >= 65 && kc <= 90) return 'Key' + String.fromCharCode(kc);
          if (kc >= 48 && kc <= 57) return 'Digit' + (kc - 48);
          if (kc === 17) return 'ControlLeft';
          if (kc === 16) return 'ShiftLeft';
          if (kc === 18) return 'AltLeft';
          if (kc === 32) return 'Space';
          return null;
        }
        function autoDetectSprintKey() {
          try {
            var lsKeys = Object.keys(localStorage);
            for (var i = 0; i < lsKeys.length; i++) {
              var val = localStorage.getItem(lsKeys[i]);
              if (!val || val.length > 1000000) continue;
              // Match key_key.sprint followed by any non-digit chars then a number
              var m = /key_key\.sprint[^\d]*(\d+)/.exec(val);
              if (m) {
                var code = keyCodeToCode(parseInt(m[1], 10));
                if (code) return code;
              }
            }
          } catch(_) {}
          return null;
        }
        if (CFG.sprintKeyAuto) {
          // Initial scan on launch (catches returning users with saved keybinds)
          var detected = autoDetectSprintKey();
          if (detected) {
            sprintState.code = detected;
            try { console.log('[EaglerLite] Auto-detected sprint key:', detected); } catch(_) {}
          } else {
            try { console.log('[EaglerLite] Sprint key auto-detect: no saved keybinds found yet, using fallback:', sprintState.code); } catch(_) {}
          }
          // Live update: re-scan when localStorage changes (game saves options
          // after the user changes their keybinds in-game)
          try {
            window.addEventListener('storage', function(e) {
              var d = autoDetectSprintKey();
              if (d && d !== sprintState.code) {
                sprintState.code = d;
                try { console.log('[EaglerLite] Sprint key updated via storage event:', d); } catch(_) {}
              }
            });
          } catch(_) {}
          // Poll every 2s for the first 30s — catches first-launch scenarios
          // where the game saves its options shortly after loading.
          try {
            var pollCount = 0;
            var pollInterval = setInterval(function() {
              var d = autoDetectSprintKey();
              if (d && d !== sprintState.code) {
                sprintState.code = d;
                try { console.log('[EaglerLite] Sprint key updated via poll:', d); } catch(_) {}
                clearInterval(pollInterval);
                return;
              }
              if (++pollCount > 15) clearInterval(pollInterval); // 15 * 2s = 30s
            }, 2000);
          } catch(_) {}
        }

        // Resolve keycode + key string from current sprintState.code.
        // Called per-event so auto-detect updates take effect immediately.
        function resolveSprintKey() {
          var code = sprintState.code;
          var keyCode = 17, keyStr = 'Control';
          if (code === 'ShiftLeft' || code === 'ShiftRight') { keyCode = 16; keyStr = 'Shift'; }
          else if (code === 'AltLeft' || code === 'AltRight') { keyCode = 18; keyStr = 'Alt'; }
          else if (code === 'ControlLeft' || code === 'ControlRight') { keyCode = 17; keyStr = 'Control'; }
          else {
            // Letter keys (KeyA–KeyZ) and digit keys (Digit0–Digit9)
            var letterMatch = /^Key([A-Z])$/.exec(code);
            var digitMatch = /^Digit([0-9])$/.exec(code);
            if (letterMatch) { keyCode = letterMatch[1].charCodeAt(0); keyStr = letterMatch[1].toLowerCase(); }
            else if (digitMatch) { keyCode = digitMatch[1].charCodeAt(0); keyStr = digitMatch[1]; }
            // Default already set to Control above for unknown codes
          }
          return { code: code, keyCode: keyCode, keyStr: keyStr };
        }

        function sendSprintEvent(type) { 
          var r = resolveSprintKey();
          var ev = new KeyboardEvent(type, { code: r.code, keyCode: r.keyCode, which: r.keyCode, key: r.keyStr, bubbles: true }); 
          try { Object.defineProperty(ev, 'isTrusted', { get: function() { return true; }, configurable: true }); } catch(_) {} 
          document.dispatchEvent(ev); 
        }
        window.addEventListener('keydown', function(e) { 
          if ((e.code === 'KeyW' || e.keyCode === 87) && !e.repeat && document.pointerLockElement) { 
            sendSprintEvent('keydown'); 
          } 
        });
        window.addEventListener('keyup', function(e) { 
          if ((e.code === 'KeyW' || e.keyCode === 87) && document.pointerLockElement) { 
            sendSprintEvent('keyup'); 
          } 
        });
      }

      function blankCache(gl) { return { buffers: Object.create(null) }; }

      // Fullbright: Strict 28-byte VBO mutation (1.12.2 ONLY)
      function applyFullbright(raw) {
        if (CFG.gameVersion !== '1.12.2') return;
        try {
          var f, i16;
          if (raw instanceof Float32Array) { f = raw; i16 = new Int16Array(f.buffer, f.byteOffset, Math.floor(f.byteLength / 2)); } 
          else if (raw && raw.buffer instanceof ArrayBuffer) { f = new Float32Array(raw.buffer, raw.byteOffset, Math.floor(raw.byteLength / 4)); i16 = new Int16Array(raw.buffer, raw.byteOffset, Math.floor(raw.byteLength / 2)); } 
          else if (raw instanceof ArrayBuffer) { f = new Float32Array(raw); i16 = new Int16Array(raw); } 
          else return;

          if (f.length < 7) return;
          if (f.byteLength % 28 !== 0) return;

          // Validate this is actually 1.12.2 terrain vertex data by sampling Y coords.
          // Random non-vertex data that happens to be 28-byte aligned will usually have
          // implausible float values here, which lets us reject false positives that
          // would otherwise corrupt non-vertex buffers (causing black/broken textures).
          var validCount = 0;
          var sampleCount = Math.min(8, Math.floor(f.length / 7));
          for (var s = 0; s < sampleCount; s++) {
            var sy = f[s * 7 + 1];
            if (sy >= -1000 && sy <= 2000) validCount++;
          }
          if (validCount < sampleCount * 0.75) return;

          for (var i = 0; i + 6 < f.length; i += 7) {
            var y = f[i+1];
            if (y < -200 || y > 600) continue;
            var sIdx = i * 2 + 12;
            // 1.12.2 lightmap: two shorts (skyLight, blockLight), each 0-240.
            // Only bump to 240 (true max bright) if the current value is in the
            // plausible lightmap range [0, 239]. Writing into out-of-range values
            // would corrupt non-vertex buffers — the root cause of black textures.
            var v0 = i16[sIdx], v1 = i16[sIdx + 1];
            if (v0 >= 0 && v0 < 240) i16[sIdx] = 240;
            if (v1 >= 0 && v1 < 240) i16[sIdx + 1] = 240;
          }
        } catch(_) {}
      }

      function wrapGL(gl) {
        if (gl.__eaglerLite) return gl;
        gl.__eaglerLite = true;

        var cache = blankCache(gl);
        var bufferMeta = new Map();

        function wrap(name, fn) {
          if (typeof gl[name] === 'function') {
            var orig = gl[name].bind(gl);
            gl[name] = fn(orig);
            return orig;
          }
          return null;
        }

        if (CFG.p8 || CFG.p12) {
          try {
            if (CFG.p8) gl.disable(gl.DITHER);
            if (CFG.p12 && typeof gl.LINE_SMOOTH !== 'undefined') gl.disable(gl.LINE_SMOOTH);
          } catch(e) {}
        }

        if (CFG.p14 && gl.canvas && gl.canvas.style) {
          gl.canvas.style.imageRendering = 'pixelated';
        }

        if (CFG.p13 && typeof gl.renderbufferStorageMultisample === 'function') {
          wrap('renderbufferStorageMultisample', function(orig) {
            return function(target, samples, internalformat, width, height) {
              try { gl.renderbufferStorage(target, internalformat, width, height); } catch(e) { orig(target, samples, internalformat, width, height); }
            };
          });
        }

        if (CFG.p10) {
          try { gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE); } catch(e) {}
          wrap('pixelStorei', function(orig) {
            return function(pname, param) {
              if (pname === gl.UNPACK_COLORSPACE_CONVERSION_WEBGL) { param = gl.NONE; }
              orig(pname, param);
            };
          });
        }

        if (CFG.p11) {
          wrap('getError', function(orig) {
            return function() {
              if (gl.isContextLost()) return 9; // CONTEXT_LOST_WEBGL
              return 0; // gl.NO_ERROR
            };
          });
        }

        if (CFG.p7) {
          wrap('generateMipmap', function(orig) { return function(target) {}; });
        }

        var origBufferData = wrap('bufferData', function(orig) {
          return function(target, dataOrSize, usage, srcOffset, length) {
            if (CFG.fullbright && target === gl.ARRAY_BUFFER && dataOrSize && typeof dataOrSize !== 'number' && dataOrSize.byteLength >= 16384) {
              try { applyFullbright(dataOrSize); } catch(_) {}
            }
            if (srcOffset !== undefined) orig(target, dataOrSize, usage, srcOffset, length);
            else orig(target, dataOrSize, usage);

            var buf = cache.buffers[target];
            if (buf) {
              var size = (typeof dataOrSize === 'number') ? dataOrSize : (dataOrSize && dataOrSize.byteLength !== undefined ? dataOrSize.byteLength : 0);
              if (size > 0) bufferMeta.set(buf, { size: size, usage: usage });
            }
          };
        });

        wrap('bindBuffer', function(orig) {
          return function(target, buf) {
            cache.buffers[target] = buf;
            orig(target, buf);
          };
        });

        wrap('bufferSubData', function(orig) {
          return function(target, offset, data, srcOffset, length) {
            if (CFG.fullbright && target === gl.ARRAY_BUFFER && data && typeof data !== 'number' && data.byteLength >= 16384) {
              try { applyFullbright(data); } catch(_) {}
            }
            if (CFG.p5 && offset === 0 && data) {
              var bufId = cache.buffers[target];
              if (bufId) {
                var meta = bufferMeta.get(bufId);
                if (meta && data.byteLength <= meta.size) {
                  try { origBufferData(target, meta.size, meta.usage); } catch(_) {}
                }
              }
            }
            if (srcOffset !== undefined) orig(target, offset, data, srcOffset, length);
            else orig(target, offset, data);
          };
        });

        wrap('deleteBuffer', function(orig) {
          return function(buf) {
            if (buf) {
              var b = cache.buffers;
              for (var k in b) if (b[k] === buf) delete b[k];
              if (CFG.p5) bufferMeta.delete(buf);
            }
            orig(buf);
          };
        });

        wrap('texParameteri', function(orig) {
          return function(target, pname, param) {
            if (pname === gl.TEXTURE_MIN_FILTER || pname === gl.TEXTURE_MAG_FILTER) {
              if (CFG.p4) { param = gl.NEAREST; } 
              else if (CFG.p7 && pname === gl.TEXTURE_MIN_FILTER) {
                if (param === gl.NEAREST_MIPMAP_NEAREST || param === gl.LINEAR_MIPMAP_NEAREST || param === gl.NEAREST_MIPMAP_LINEAR || param === gl.LINEAR_MIPMAP_LINEAR) { param = gl.LINEAR; }
              }
            }
            orig(target, pname, param);
          };
        });

        wrap('drawArrays', function(orig) { return function(mode, first, count) { S.draws++; orig(mode, first, count); }; });
        wrap('drawElements', function(orig) { return function(mode, count, type, offset) { S.draws++; orig(mode, count, type, offset); }; });

        if (gl.canvas) {
          gl.canvas.addEventListener('webglcontextrestored', function() {
            var fresh = blankCache(gl);
            var keys = Object.keys(fresh);
            for (var i = 0; i < keys.length; i++) cache[keys[i]] = fresh[keys[i]];
            bufferMeta.clear();
            if (CFG.p8) { try { gl.disable(gl.DITHER); } catch(e) {} }
            if (CFG.p10) { try { gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE); } catch(e) {} }
            if (CFG.p12 && typeof gl.LINE_SMOOTH !== 'undefined') { try { gl.disable(gl.LINE_SMOOTH); } catch(e) {} }
          });
        }
        return gl;
      }

      var _getCtx = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function(type, opts) {
        if (CFG.p1 && (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl')) {
          opts = Object.assign({}, opts, { antialias: false, powerPreference: 'high-performance' });
        }
        var ctx = _getCtx.call(this, type, opts);
        if (ctx && (CFG.p4 || CFG.p5 || CFG.fullbright || CFG.p7 || CFG.p8 || CFG.p10 || CFG.p11 || CFG.p12 || CFG.p13 || CFG.p14) && (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl')) {
          try { return wrapGL(ctx); } catch(e) { ctx.__eaglerLite = true; }
        }
        return ctx;
      };

      // Uncap FPS & Background Throttle
      var uncapChannel = new MessageChannel();
      var uncapQueue = [];           // queue of callback ids pending dispatch
      var uncapCallbacks = new Map(); // id -> callback
      var uncapNextId = 1;
      uncapChannel.port1.onmessage = function() {
        var id = uncapQueue.shift();
        if (id === undefined) return;
        var cb = uncapCallbacks.get(id);
        uncapCallbacks.delete(id);
        if (cb) { try { cb(performance.now()); } catch(e) {} }  // try/catch prevents queue poisoning
      };
      var origRAF = window.requestAnimationFrame.bind(window);
      var origCAF = window.cancelAnimationFrame.bind(window);
      var pendingThrottle = null; // { id, cb } — most recent background-throttle setTimeout

      window.requestAnimationFrame = function(cb) {
        if (document.hidden && CFG.p3) {
          if (pendingThrottle) clearTimeout(pendingThrottle.id);
          var tid = setTimeout(function() {
            if (pendingThrottle && pendingThrottle.id === tid) pendingThrottle = null;
            try { cb(performance.now()); } catch(e) {}
          }, 1000);
          pendingThrottle = { id: tid, cb: cb };
          return tid;
        }
        if (CFG.p6 && document.pointerLockElement) {
          var uid = uncapNextId++;
          uncapCallbacks.set(uid, cb);
          uncapQueue.push(uid);
          uncapChannel.port2.postMessage(0);
          return uid;  // real handle so cancelAnimationFrame actually works
        }
        return origRAF(cb);
      };

      window.cancelAnimationFrame = function(id) {
        if (id == null) return;
        // Uncap loop handle?
        if (uncapCallbacks.has(id)) {
          uncapCallbacks.delete(id);
          var idx = uncapQueue.indexOf(id);
          if (idx !== -1) uncapQueue.splice(idx, 1);
          return;
        }
        // Background-throttle setTimeout handle?
        if (pendingThrottle && pendingThrottle.id === id) {
          clearTimeout(id);
          pendingThrottle = null;
          return;
        }
        // Native RAF handle — try both CAF and clearTimeout (id space can overlap)
        try { origCAF(id); } catch(e) {}
        try { clearTimeout(id); } catch(e) {}
      };

      // Visibility change: flush pending throttle so the game resumes immediately
      // instead of waiting up to 1s for the setTimeout to fire.
      if (CFG.p3) {
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden && pendingThrottle) {
            clearTimeout(pendingThrottle.id);
            var cb = pendingThrottle.cb;
            pendingThrottle = null;
            origRAF(function(t) { try { cb(t); } catch(e) {} });
          }
        });
      }

      // Tab Title & Favicon Cloaking
      function escapeXml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
      }
      try {
        if (CFG.tabName) {
          document.title = CFG.tabName;
          setTimeout(function() { document.title = CFG.tabName; }, 6000);
          // Persistent cloak: re-apply if the game later mutates <title>.
          // Server connect / world load often resets the title — observer catches it.
          var titleEl = document.querySelector('title');
          if (!titleEl) { titleEl = document.createElement('title'); document.head.appendChild(titleEl); }
          var cloakObserver = new MutationObserver(function() {
            if (document.title !== CFG.tabName) document.title = CFG.tabName;
          });
          cloakObserver.observe(titleEl, { childList: true, characterData: true, subtree: true });
          // Backup: poll every 2s in case the game replaces the <title> element
          // entirely (the observer on the old <title> wouldn't fire in that case).
          setInterval(function() {
            if (document.title !== CFG.tabName) {
              var t = document.querySelector('title');
              if (!t) { t = document.createElement('title'); document.head.appendChild(t); }
              document.title = CFG.tabName;
            }
          }, 2000);
        }
        if (CFG.favicon) {
          var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
          link.rel = 'icon';
          var fav = CFG.favicon;
          if (/^https?:\/\//i.test(fav) || fav.startsWith('data:') || fav.startsWith('/')) { link.href = fav; } 
          else {
            // XML-escape the emoji/character before embedding in SVG to prevent
            // injection bugs (e.g. user entering "</text><script>...")
            var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>" + escapeXml(fav) + "</text></svg>";
            link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
          }
          document.head.appendChild(link);
        }
      } catch(e) {}

      // HUD Overlay
      if (CFG.hud) {
        var hud = document.createElement('div');
        Object.assign(hud.style, { position: 'fixed', top: '4px', left: '4px', background: 'rgba(0,0,0,0.65)', color: '#ffffff', font: 'bold 11px/1.9 "Courier New",monospace', padding: '5px 11px', borderRadius: '4px', zIndex: '999999', pointerEvents: 'none', userSelect: 'none', whiteSpace: 'pre', border: '1px solid rgba(255,255,255,0.15)', letterSpacing: '0.02em' });
        function attachHUD() { if (document.body) document.body.appendChild(hud); }
        if (document.body) attachHUD(); else document.addEventListener('DOMContentLoaded', attachHUD);
        var t0 = performance.now(), fr = 0, d0 = 0;
        (function tick() { origRAF(tick); fr++; var now = performance.now(), dt = now - t0; if (dt < 500) return; var fps = (fr / dt * 1000).toFixed(1); var dpf = ((S.draws - d0) / fr).toFixed(1); var thrtl = CFG.p3 && document.hidden ? 'YES' : 'NO'; hud.textContent = 'FPS       ' + fps + '\n' + 'Draw/f    ' + dpf + '\n' + 'Throttled ' + thrtl; t0 = now; fr = 0; d0 = S.draws; })();
        var f3 = false;
        window.addEventListener('keydown', function(e) { if (e.code === 'F3') f3 = true; if (e.code === 'KeyO' && f3) hud.style.display = hud.style.display === 'none' ? '' : 'none'; });
        window.addEventListener('keyup', function(e) { if (e.code === 'F3') f3 = false; });
      }
    }

    function setStatus(msg, cls) { var el = document.getElementById('status'); el.textContent = msg; el.className = cls || ''; }
    function setProgress(v) { document.getElementById('prog-fill').style.width = Math.round(Math.max(0, Math.min(1, v)) * 100) + '%'; }
    function setBusy(on) { var btn = document.getElementById('launchBtn'); btn.disabled = on; btn.textContent = on ? 'Loading…' : 'Launch Game'; }
    function decodeBlob(blob) { return new Promise(function(res, rej) { var fr = new FileReader(); fr.onload = function() { res(fr.result); }; fr.onerror = function() { rej(fr.error); }; fr.readAsText(blob); }); }

    // Build the final HTML for the about:blank document.
    // Injects the optimizer script INSIDE the existing <head> if present,
    // otherwise wraps the content in a full HTML skeleton. Always ensures
    // <!DOCTYPE html> is present so the document is in standards mode
    // (required for requestPointerLock to work).
    function buildFinalHTML(content, optimizerHead) {
      var headOpenRe = /<head[^>]*>/i;
      var htmlOpenRe = /<html[^>]*>/i;
      var doctypeRe = /<!DOCTYPE[^>]*>/i;
      var html;
      if (headOpenRe.test(content)) {
        // Inject optimizer right after the opening <head> tag.
        html = content.replace(headOpenRe, function(match) {
          return match + '\n' + optimizerHead;
        });
      } else if (htmlOpenRe.test(content)) {
        // Has <html> but no <head> — insert a <head> with the optimizer.
        html = content.replace(htmlOpenRe, function(match) {
          return match + '\n<head>\n' + optimizerHead + '</head>\n';
        });
      } else {
        // No HTML structure — wrap in a full skeleton.
        html = '<html lang="en">\n<head>\n' + optimizerHead + '</head>\n<body>\n' + content + '\n</body>\n</html>';
      }
      // Ensure <!DOCTYPE html> is the very first thing (standards mode).
      if (!doctypeRe.test(html)) {
        html = '<!DOCTYPE html>\n' + html;
      }
      return html;
    }

    // Download the entire launcher HTML as a standalone file. Used as a fallback
    // when the launcher is in a sandboxed iframe (e.g. onecompiler) where
    // pointer lock would silently fail. When the user opens the downloaded
    // file via file://, it runs as a top-level document with full permissions.
    function downloadLauncher() {
      setBusy(true); setProgress(0); setStatus('Building standalone launcher...', 'load');

      // Sync form state to attributes so cloneNode preserves user config.
      // (cloneNode copies attributes, not current property values, for inputs.)
      try {
        var inputs = document.querySelectorAll('input[type="text"], input[type="checkbox"]');
        for (var i = 0; i < inputs.length; i++) {
          var inp = inputs[i];
          if (inp.type === 'checkbox') {
            if (inp.checked) inp.setAttribute('checked', 'checked');
            else inp.removeAttribute('checked');
          } else {
            inp.setAttribute('value', inp.value);
          }
        }
        var sel = document.getElementById('gameVersion');
        if (sel) {
          for (var j = 0; j < sel.options.length; j++) {
            if (sel.options[j].selected) sel.options[j].setAttribute('selected', 'selected');
            else sel.options[j].removeAttribute('selected');
          }
        }
        // Sync <details open> state so collapsed sections stay collapsed.
        var detailsEls = document.querySelectorAll('details');
        for (var d = 0; d < detailsEls.length; d++) {
          if (detailsEls[d].open) detailsEls[d].setAttribute('open', 'open');
          else detailsEls[d].removeAttribute('open');
        }
      } catch(_) {}

      // Extract the launcher's own comment header for attribution.
      var launcherComment = '';
      try {
        for (var node = document.firstChild; node; node = node.nextSibling) {
          if (node.nodeType === 8) { launcherComment = '<!--' + node.nodeValue + '-->\n'; break; }
          if (node.nodeType === 1) break;
        }
      } catch(_) {}

      // Clone the launcher DOM and reset transient UI state so the downloaded
      // copy opens in a clean "ready to launch" state.
      var cloneRoot = document.documentElement.cloneNode(true);
      var cStatus = cloneRoot.querySelector('#status');
      if (cStatus) { cStatus.textContent = 'Ready — configure below and click Launch'; cStatus.className = ''; }
      var cProg = cloneRoot.querySelector('#prog-fill');
      if (cProg) cProg.style.width = '0%';
      var cBtn = cloneRoot.querySelector('#launchBtn');
      if (cBtn) { cBtn.disabled = false; cBtn.textContent = 'Launch Game'; }

      var fullHTML = launcherComment + '<!DOCTYPE html>\n' + cloneRoot.outerHTML;
      var blob = new Blob([fullHTML], { type: 'text/html;charset=utf-8' });
      var blobUrl = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = blobUrl;
      a.download = 'EaglerLite.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 60000);

      setStatus('✓ Downloaded EaglerLite.html — open the file, then click Launch Game (pointer lock will work).', 'ok');
      setProgress(1); setBusy(false);
    }

    // Detect sandboxed environments (e.g. onecompiler, JSFiddle) where pointer lock
    // is blocked because the opened tab inherits the iframe's sandbox restrictions.
    // In these cases we fall back to downloading a self-contained HTML file that
    // the user opens locally (file:// origin has full pointer lock permissions).
    function detectSandbox() {
      try {
        if (window.self === window.top) return false; // top-level — unrestricted
        var frame = window.frameElement;
        if (!frame) return true; // cross-origin iframe — assume sandboxed
        var sandbox = frame.getAttribute('sandbox');
        if (sandbox === null) return false; // no sandbox attribute
        if (sandbox === '') return true;    // empty sandbox = max restrictions
        // Need both allow-pointer-lock AND allow-popups-to-escape-sandbox
        // for the opened tab to actually have pointer lock permissions.
        return sandbox.indexOf('allow-pointer-lock') === -1 ||
               sandbox.indexOf('allow-popups-to-escape-sandbox') === -1;
      } catch(e) {
        return true;
      }
    }

    async function launchGame() {
      var version = document.getElementById('gameVersion').value;
      var srcUrl = (version === '1.21.11') ? SRC_URL_121 : SRC_URL_112;
      var tabName = (document.getElementById('tabName').value.trim()) || 'Eaglercraft';
      var sprintKey = (document.getElementById('sprintKey').value.trim()) || 'ControlLeft';
      var favicon = document.getElementById('favicon').value.trim();
      
      var cfg = {
        p1: document.getElementById('ch1').checked, p3: document.getElementById('ch3').checked, p4: document.getElementById('ch4').checked,
        p5: document.getElementById('ch5').checked, p6: document.getElementById('ch6').checked, p7: document.getElementById('ch11').checked,
        p8: document.getElementById('ch12').checked, p9: document.getElementById('ch13').checked, p10: document.getElementById('ch14').checked,
        p11: document.getElementById('ch15').checked, p12: document.getElementById('ch16').checked, p13: document.getElementById('ch17').checked,
        p14: document.getElementById('ch18').checked, fullbright: document.getElementById('ch8').checked, autosprint: document.getElementById('ch9').checked,
        zoom: document.getElementById('ch10').checked, hud: document.getElementById('ch7').checked, sprintKeyAuto: document.getElementById('ch2').checked, tabName: tabName, sprintKey: sprintKey, favicon: favicon, gameVersion: version
      };

      if (version === '1.21.11') {
        setBusy(true); setProgress(1); setStatus('Launching 1.21.11...', 'load');
        var url = new URL(srcUrl);
        Object.keys(cfg).forEach(function(key) { if (typeof cfg[key] === 'boolean') { url.searchParams.set(key, cfg[key]); } else if (cfg[key]) { url.searchParams.set(key, cfg[key]); } });
        window.open(url.toString(), '_blank');
        setTimeout(function() { setStatus('✓ Launched 1.21.11!', 'ok'); setBusy(false); }, 500);
      } else {
        // --- DIRECT FETCH METHOD FOR 1.12.2 ---
        var optiCode = '(' + EaglerLiteOptimizer.toString() + ')(' + JSON.stringify(cfg) + ');';
        var safeOptiCode = optiCode.replace(/<\/script>/gi, '<\\/script>');
        var baseUrl = srcUrl.substring(0, srcUrl.lastIndexOf('/') + 1);

        // Sandbox check: if the launcher is in a sandboxed iframe (e.g. onecompiler),
        // pointer lock will silently fail in the opened tab. Fall back to downloading
        // the entire launcher HTML so the user can run it locally as a top-level
        // document (file://) where pointer lock is unrestricted.
        if (detectSandbox()) {
          downloadLauncher();
          return;
        }

        // Open about:blank synchronously in the click handler — MUST happen before
        // any await to preserve the user-gesture required for pointer lock.
        var win = window.open('about:blank', '_blank');
        if (!win) {
          // Popup blocked — fall back to downloading the launcher.
          setStatus('Pop-up blocked — downloading standalone launcher...', 'load');
          downloadLauncher();
          return;
        }
        try { win.document.title = tabName; } catch(_) {}
        setBusy(true); setProgress(0); setStatus('Fetching game data...', 'load');

        // Fetch game source with proxy fallback.
        var response;
        try {
          response = await fetch(srcUrl);
          if (!response.ok) throw new Error('HTTP ' + response.status);
        } catch (err) {
          setStatus('Direct fetch blocked, retrying via proxy...', 'load');
          try {
            var proxyUrl = 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(srcUrl);
            response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('HTTP ' + response.status);
          } catch (err2) {
            setStatus('Download failed: ' + err2.message, 'err');
            try { win.close(); } catch(_) {}  // close the empty about:blank tab
            setBusy(false);
            return;
          }
        }

        // Stream-download with full error handling.
        try {
          var total = +response.headers.get('Content-Length') || 0;
          var reader = response.body.getReader();
          var parts = []; var loaded = 0;
          for (;;) {
            var chunk = await reader.read();
            if (chunk.done) break;
            parts.push(chunk.value);
            loaded += chunk.value.length;
            if (total) {
              setProgress(Math.min(0.9, loaded / total));
              setStatus('Downloading... ' + Math.round((loaded / total) * 100) + '%', 'load');
            } else {
              setProgress(0.5);
            }
          }
          setProgress(0.95); setStatus('Decoding game data...', 'load');
          var content = await decodeBlob(new Blob(parts));
          content = content.replace(/^<\?xml[^>]*\?>\s*/i, '');

          // Build final HTML with optimizer injected INSIDE <head> (never before <!DOCTYPE>).
          setStatus('Injecting optimizations...', 'load');
          var optimizerHead = '<meta charset="UTF-8">\n<base href="' + baseUrl + '">\n<scr' + 'ipt>' + safeOptiCode + '</scr' + 'ipt>\n';
          var finalHTML = buildFinalHTML(content, optimizerHead);

          win.document.open();
          win.document.write(finalHTML);
          win.document.close();

          setStatus('✓ Launched in new tab!', 'ok');
          setProgress(1);
        } catch (e) {
          setStatus('Error launching: ' + e.message, 'err');
          try { win.close(); } catch(_) {}  // close the empty/partial about:blank tab
        } finally {
          setBusy(false);
        }
      }
    }

    document.getElementById('launchBtn').addEventListener('click', launchGame);
    document.getElementById('tabName').addEventListener('keydown', function(e) { if (e.key === 'Enter') launchGame(); });
  </script>
</body>
</html>
